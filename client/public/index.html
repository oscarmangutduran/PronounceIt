    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Remove browser default white focus outlines and backgrounds on inputs */
      input, textarea, select {
        outline: none !important;
        box-shadow: none !important;
        background-color: transparent !important;
      }
      input:focus, textarea:focus, select:focus, input:focus-visible, textarea:focus-visible {
        outline: none !important;
        box-shadow: none !important;
        background-color: transparent !important;
      }
      /* Prevent browser autofill from creating an ugly white/light-blue background */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active,
      input:autofill {
        -webkit-text-fill-color: #ffffff !important;
        caret-color: #ffffff !important;
        -webkit-box-shadow: 0 0 0px 1000px #1a142b inset !important;
        box-shadow: 0 0 0px 1000px #1a142b inset !important;
        transition: background-color 5000000s ease-in-out 0s !important;
      }
      input:-webkit-autofill:focus {
        -webkit-box-shadow: 0 0 0px 1000px #21142b inset !important;
        box-shadow: 0 0 0px 1000px #21142b inset !important;
      }

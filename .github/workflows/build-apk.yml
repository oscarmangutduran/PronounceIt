name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - APP
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle script executable
        run: chmod +x client/android/gradlew

      - name: Build Android Release APK
        run: |
          cd client/android
          ./gradlew assembleRelease --no-daemon

      - name: Locate and Package APK
        run: |
          mkdir -p release-apks
          APK_FILE=$(find client/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find client/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" release-apks/PronounceIt-v1.7.2.apk
          cp "$APK_FILE" release-apks/PronounceIt.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.2
          name: PronounceIt v1.7.2 - Android Release
          overwrite_files: true
          body: |
            ## PronounceIt v1.7.2

            - Mini-vídeo animado de introducción en el arranque y corrección del Splash Screen nativo en Android.
            - Contador de rachas diarias según los días consecutivos agregando palabras y calendario semanal.
            - Eliminación y edición directa de categorías y subcategorías desde la barra móvil/APK y modales.
            - Ajuste de margen de seguridad inferior en el formulario de palabras para evitar colisión con la barra de Android.
          files: |
            release-apks/PronounceIt-v1.7.2.apk
            release-apks/PronounceIt.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

